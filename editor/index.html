<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Night Shift — World Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg: rgba(8,10,14,.92); --line: rgba(255,255,255,.14); --acc: #ffd25a; --txt: #e6e6e6; --dim: #9aa; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Courier New", monospace; color: var(--txt); font-size: 13px; }
  canvas { display: block; }
  button, input, select { font-family: inherit; font-size: 12px; color: var(--txt); }
  button { background: rgba(255,255,255,.05); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; letter-spacing: 1px; }
  button:hover { background: rgba(255,210,90,.16); border-color: var(--acc); }
  button.active { background: rgba(255,210,90,.28); border-color: var(--acc); color: #fff; }
  button.primary { background: rgba(255,210,90,.22); border-color: var(--acc); }
  input[type=text], input[type=number], select { background: rgba(0,0,0,.4); border: 1px solid var(--line); padding: 4px 6px; width: 100%; box-sizing: border-box; }
  input[type=color] { width: 100%; height: 26px; background: none; border: 1px solid var(--line); padding: 0; }
  input[type=range] { width: 100%; accent-color: var(--acc); }

  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
  #topbar h1 { font-size: 14px; letter-spacing: 4px; color: var(--acc); margin: 0 14px 0 0; }
  #topbar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  #topbar .grow { flex: 1; }
  #worldName { width: 160px; }

  #tools { position: fixed; left: 0; top: 44px; bottom: 0; width: 132px; display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; background: var(--bg); border-right: 1px solid var(--line); z-index: 5; overflow-y: auto; }
  #tools small { color: var(--dim); letter-spacing: 2px; font-size: 10px; margin: 8px 0 2px; }
  #tools button { text-align: left; }
  #tools button b { color: var(--acc); margin-right: 6px; }

  #panel { position: fixed; right: 0; top: 44px; bottom: 0; width: 270px; background: var(--bg); border-left: 1px solid var(--line); z-index: 5; overflow-y: auto; padding: 10px 12px; box-sizing: border-box; }
  #panel h3 { margin: 6px 0 8px; font-size: 11px; letter-spacing: 3px; color: var(--acc); }
  #panel .sec { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  .field { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 6px; margin: 5px 0; }
  .field label { color: var(--dim); font-size: 11px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .row2 button, .row3 button { padding: 5px 4px; font-size: 11px; }
  .val { color: var(--acc); font-size: 11px; float: right; }
  .note { color: var(--dim); font-size: 11px; line-height: 1.5; margin: 6px 0; }

  #hint { position: fixed; left: 140px; right: 278px; bottom: 0; padding: 6px 12px; background: rgba(0,0,0,.55); color: var(--dim); font-size: 11px; z-index: 4; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast { position: fixed; left: 50%; top: 54px; transform: translateX(-50%); background: rgba(0,0,0,.7); border: 1px solid var(--line); padding: 6px 14px; opacity: 0; transition: opacity .2s; z-index: 6; pointer-events: none; }

  body.playing #topbar, body.playing #tools, body.playing #panel, body.playing #hint { display: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.playing #hud { display: block; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: 0 0 4px #000; }
  #prompt { position: absolute; left: 50%; top: 56%; transform: translateX(-50%); font-size: 18px; padding: 6px 14px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.25); border-radius: 4px; opacity: 0; transition: opacity .12s; white-space: nowrap; }
  #prompt b { color: var(--acc); }
  #message { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-size: 20px; text-shadow: 0 0 8px #000; opacity: 0; transition: opacity .3s; text-align: center; max-width: 70%; }
  #inventory { position: absolute; left: 20px; bottom: 20px; font-size: 14px; background: rgba(0,0,0,.45); padding: 8px 14px; }
  #inventory small { display: block; color: var(--dim); letter-spacing: 2px; font-size: 11px; margin-bottom: 4px; }
  #inventory span { display: inline-block; margin-right: 10px; color: var(--acc); }
  #playTip { position: absolute; right: 20px; bottom: 20px; font-size: 12px; color: var(--dim); background: rgba(0,0,0,.45); padding: 8px 14px; text-align: right; line-height: 1.5; }
  #playTip b { color: var(--txt); }
  #clickToPlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); z-index: 7; cursor: pointer; font-size: 16px; letter-spacing: 3px; }
  #clickToPlay.show { display: flex; }
</style>
</head>
<body>
  <div id="topbar">
    <h1>WORLD EDITOR</h1>
    <input id="worldName" type="text" placeholder="world name" />
    <button id="btnNew" title="Start a blank world">NEW</button>
    <button id="btnStarter" title="Load the small sample world">SAMPLE</button>
    <div class="sep"></div>
    <button id="btnSave" title="Save to this browser (Ctrl+S)">SAVE</button>
    <button id="btnExport" title="Download as .json">EXPORT</button>
    <button id="btnImport" title="Load a .json file">IMPORT</button>
    <input id="fileImport" type="file" accept="application/json" style="display:none" />
    <div class="sep"></div>
    <button id="btnUndo" title="Undo (Ctrl+Z)">UNDO</button>
    <div class="grow"></div>
    <button id="btnPlayHere" title="Drop the guard where the camera is looking">PLAY HERE</button>
    <button id="btnPlay" class="primary" title="Play from the spawn marker (P)">▶ PLAY</button>
  </div>

  <div id="tools">
    <small>EDIT</small>
    <button data-tool="select"><b>Q</b>Select</button>
    <button data-tool="terrain"><b>T</b>Terrain</button>
    <button data-tool="path"><b>H</b>Path</button>
    <small>PLACE</small>
    <button data-tool="box">Box</button>
    <button data-tool="wall">Wall</button>
    <button data-tool="ramp">Ramp</button>
    <button data-tool="cylinder">Cylinder</button>
    <button data-tool="sphere">Sphere</button>
    <button data-tool="door">Door</button>
    <button data-tool="light">Light</button>
    <button data-tool="tree">Tree</button>
    <button data-tool="treebrush">Tree brush</button>
    <button data-tool="spawn"><b>S</b>Spawn</button>
  </div>

  <div id="panel"><div id="panelContent"></div></div>
  <div id="hint"></div>
  <div id="toast"></div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="message"></div>
    <div id="inventory"><small>INVENTORY</small><span id="inventoryText">— empty —</span></div>
    <div id="playTip"><b>Esc</b> back to editor · <b>F</b> interact · <b>L</b> flashlight · hold <b>RMB/Q</b> aim light · <b>Shift</b> run</div>
  </div>
  <div id="clickToPlay">CLICK TO TAKE CONTROL</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
